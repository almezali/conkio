[package]
name = "conkio"
version = "1.0.3"
edition = "2021"
description = "A modern Linux Conky theme manager"
license = "GPL-3.0-or-later"
default-run = "conkio"

[[bin]]
name = "conkio"
path = "src/main.rs"

[dependencies]
slint = { version = "1.5.1", features = ["unstable-winit-030"] }
# Slint's current text stack uses fontique; enabling dynamic fontconfig keeps
# cross compilation independent of a host pkg-config/sysroot.
fontique = { version = "0.11.1", features = ["fontconfig-dlopen"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
walkdir = "2.5"
zip = "0.6"
tar = "0.4"
flate2 = "1.0"
tempfile = "3.10"
rfd = "0.14"
regex = "1.11"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
ureq = { version = "2.12", features = ["json"] }
sha2 = "0.10"
url = "2"
image = "0.25"
bzip2 = "0.5"
libc = "0.2"
raw-window-handle = "0.6"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"

[build-dependencies]
slint-build = "1.5.1"
